spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS audit
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
      org:
        hibernate:
          envers:
            default_schema: audit
            audit_table_suffix: _aud
            revision_field_name: rev
            revision_type_field_name: revtype
            store_data_at_delete: true
            global_with_modified_flag: true
  liquibase:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 3025

app:
  base-url: http://localhost:8080/api

security:
  jwt:
    access-token-expiration: 3600
    refresh-token-expiration: 86400
    issuer: http://localhost:8080
    client-id: condominio
    client-secret: condominio-secret