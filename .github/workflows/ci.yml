name: CICD Project

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Unit + Integration + BDD ────────────────────────────────────────────────
  unit-tests:
    name: Unit / Integration / BDD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests + coverage gate
        run: mvn verify --no-transfer-progress

      - name: Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload Cucumber BDD JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-bdd-report
          path: target/cucumber-reports/
          if-no-files-found: ignore

  # ── E2E ────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E (full-stack)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run E2E tests
        run: mvn verify -Pe2e --no-transfer-progress

      - name: Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      - name: Upload JaCoCo e2e report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-e2e-report
          path: target/site/jacoco/

      - name: Upload Cucumber e2e JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-e2e-report
          path: target/cucumber-reports/
          if-no-files-found: ignore

  # ── Static Analysis ─────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile (skip tests)
        run: mvn compile --no-transfer-progress -DskipTests

      - name: SpotBugs
        run: mvn spotbugs:spotbugs --no-transfer-progress -DskipTests
        continue-on-error: true

      - name: PMD
        run: mvn pmd:pmd --no-transfer-progress -DskipTests
        continue-on-error: true

      - name: Checkstyle
        run: mvn checkstyle:checkstyle --no-transfer-progress -DskipTests
        continue-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore

      - name: Upload PMD report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmd-report
          path: target/pmd.xml
          if-no-files-found: ignore

      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore
