name: CICD Project

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Unit + Integration + BDD ────────────────────────────────────────────────
  unit-tests:
    name: Unit / Integration / BDD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests + coverage gate
        run: mvn verify --no-transfer-progress

      - name: Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload Cucumber BDD JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-bdd-report
          path: target/cucumber-reports/
          if-no-files-found: ignore

  # ── E2E ────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E (full-stack)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run E2E tests
        run: mvn verify -Pe2e --no-transfer-progress

      - name: Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      - name: Upload JaCoCo e2e report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/site/jacoco/jacoco.xml'
          detailed_summary: true
          include_passed: true

      - name: Upload Cucumber e2e JSON
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/cucumber-reports/results.json'
          detailed_summary: true
          include_passed: true

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (type-check / lint / unit tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/react/coverage/
          if-no-files-found: ignore