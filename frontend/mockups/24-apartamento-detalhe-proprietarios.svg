<svg width="900" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif">
  <rect width="900" height="560" fill="#f5f5f5"/>
  <rect x="0" y="0" width="220" height="560" fill="#1565C0"/>
  <text x="20" y="40" fill="white" font-size="18" font-weight="bold">CondoGest</text>
  <rect x="240" y="20" width="640" height="520" rx="8" fill="white"/>
  <text x="268" y="55" fill="#212121" font-size="20" font-weight="bold">Apt 101 — Bloco A</text>
  <text x="268" y="75" fill="#757575" font-size="13">Moradores e proprietários do apartamento</text>
  <!-- Tabs (Proprietários active) -->
  <rect x="268" y="90" width="592" height="44" fill="#FAFAFA" rx="4"/>
  <rect x="268" y="130" width="592" height="2" fill="#E0E0E0"/>
  <text x="300" y="117" fill="#9E9E9E" font-size="14">Moradores</text>
  <text x="420" y="117" fill="#1565C0" font-size="14" font-weight="bold">Proprietários</text>
  <rect x="415" y="130" width="115" height="2" fill="#1565C0"/>
  <!-- Content -->
  <text x="268" y="160" fill="#212121" font-size="16" font-weight="bold">Proprietários</text>
  <rect x="650" y="143" width="180" height="34" rx="4" fill="#1565C0"/>
  <text x="664" y="165" fill="white" font-size="12">+ Novo Proprietário</text>
  <!-- Table -->
  <rect x="268" y="175" width="592" height="32" fill="#F5F5F5"/>
  <text x="280" y="196" fill="#616161" font-size="12" font-weight="bold">Nome</text>
  <text x="400" y="196" fill="#616161" font-size="12" font-weight="bold">Tipo</text>
  <text x="500" y="196" fill="#616161" font-size="12" font-weight="bold">Documento</text>
  <text x="630" y="196" fill="#616161" font-size="12" font-weight="bold">E-mail</text>
  <text x="780" y="196" fill="#616161" font-size="12" font-weight="bold">Ações</text>
  <!-- Row 1 -->
  <rect x="268" y="207" width="592" height="36" fill="white"/>
  <line x1="268" y1="243" x2="860" y2="243" stroke="#EEEEEE" stroke-width="1"/>
  <text x="280" y="229" fill="#212121" font-size="13">Maria Oliveira Costa</text>
  <rect x="393" y="215" width="86" height="20" rx="10" fill="none" stroke="#1565C0" stroke-width="1"/>
  <text x="401" y="229" fill="#1565C0" font-size="11">Pessoa Física</text>
  <text x="500" y="229" fill="#424242" font-size="12">987.654.321-00</text>
  <text x="630" y="229" fill="#424242" font-size="12">maria@email.com</text>
  <circle cx="792" cy="225" r="12" fill="#E3F2FD"/>
  <text x="786" y="230" fill="#1565C0" font-size="13">✎</text>
  <circle cx="822" cy="225" r="12" fill="#FFF3E0"/>
  <text x="816" y="229" fill="#E65100" font-size="11">⛓</text>
  <!-- Row 2 (PJ) -->
  <rect x="268" y="243" width="592" height="36" fill="#FAFAFA"/>
  <text x="280" y="265" fill="#212121" font-size="13">Imóveis Brasil LTDA</text>
  <rect x="393" y="251" width="92" height="20" rx="10" fill="none" stroke="#7B1FA2" stroke-width="1"/>
  <text x="399" y="265" fill="#7B1FA2" font-size="11">Pessoa Jurídica</text>
  <text x="500" y="265" fill="#424242" font-size="12">98.765.432/0001-10</text>
  <text x="630" y="265" fill="#424242" font-size="12">imoveis@brasil.com</text>
  <circle cx="792" cy="261" r="12" fill="#E3F2FD"/>
  <text x="786" y="266" fill="#1565C0" font-size="13">✎</text>
  <circle cx="822" cy="261" r="12" fill="#FFF3E0"/>
  <text x="816" y="265" fill="#E65100" font-size="11">⛓</text>
  <!-- Notes -->
  <text x="268" y="310" fill="#757575" font-size="11">✎ = Editar dados do proprietário (nome, email, doc, telefone) — PUT /api/proprietarios/{id}</text>
  <text x="268" y="328" fill="#757575" font-size="11">⛓ = Desassociar do apartamento (mantém o proprietário no sistema) — DELETE /api/proprietarios/{id}/apartamentos/{aptId}</text>
  <text x="268" y="346" fill="#757575" font-size="11">Novo Proprietário cria PROP_PF ou PROP_PJ e já associa ao apartamento — POST /api/proprietarios + associar</text>
  <text x="268" y="364" fill="#757575" font-size="11">Relação: N Proprietários ↔ M Apartamentos via proprietario_apartamentos</text>
  <text x="268" y="382" fill="#757575" font-size="11">Tipo fica desabilitado ao editar (não é permitido mudar PF→PJ após criação)</text>
</svg>
