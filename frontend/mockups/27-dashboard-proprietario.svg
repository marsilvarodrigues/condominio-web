<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif">
  <rect width="900" height="600" fill="#f5f5f5"/>

  <!-- Sidebar (proprietário view) -->
  <rect x="0" y="0" width="220" height="600" fill="#1565C0"/>
  <text x="20" y="40" fill="white" font-size="18" font-weight="bold">CondoGest</text>
  <rect x="8" y="55" width="204" height="28" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="20" y="73" fill="white" font-size="13" font-weight="bold">Dashboard</text>
  <text x="20" y="105" fill="#90CAF9" font-size="13">Meus Imóveis</text>
  <text x="20" y="130" fill="#90CAF9" font-size="13">Extrato por Imóvel</text>
  <text x="20" y="155" fill="#90CAF9" font-size="13">Alterar Senha</text>

  <!-- Main -->
  <rect x="240" y="20" width="640" height="560" rx="8" fill="white"/>

  <text x="268" y="55" fill="#212121" font-size="20" font-weight="bold">Dashboard — Proprietário</text>
  <text x="268" y="75" fill="#757575" font-size="13">João Silva Santos · 2 imóveis</text>

  <!-- Summary cards -->
  <rect x="268" y="95" width="180" height="100" rx="8" fill="#E3F2FD"/>
  <text x="285" y="120" fill="#1565C0" font-size="13" font-weight="bold">Imóveis</text>
  <text x="285" y="150" fill="#212121" font-size="36" font-weight="bold">2</text>
  <text x="285" y="172" fill="#616161" font-size="12">ativos</text>

  <rect x="464" y="95" width="180" height="100" rx="8" fill="#E8F5E9"/>
  <text x="481" y="120" fill="#2E7D32" font-size="13" font-weight="bold">Ocupação</text>
  <text x="481" y="150" fill="#212121" font-size="36" font-weight="bold">1</text>
  <text x="481" y="172" fill="#616161" font-size="12">imóvel ocupado</text>

  <rect x="660" y="95" width="180" height="100" rx="8" fill="#FFF3E0"/>
  <text x="677" y="120" fill="#E65100" font-size="13" font-weight="bold">Pendências</text>
  <text x="677" y="150" fill="#212121" font-size="36" font-weight="bold">0</text>
  <text x="677" y="172" fill="#616161" font-size="12">cobrancas</text>

  <!-- Properties list -->
  <text x="268" y="225" fill="#212121" font-size="16" font-weight="bold">Meus Imóveis</text>

  <!-- Property card 1 -->
  <rect x="268" y="238" width="285" height="130" rx="8" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="285" y="262" fill="#212121" font-size="15" font-weight="bold">Apt 101 — Bloco A</text>
  <text x="285" y="282" fill="#757575" font-size="12">Residencial Primavera</text>
  <rect x="285" y="292" width="60" height="20" rx="10" fill="#E3F2FD"/>
  <text x="296" y="306" fill="#1565C0" font-size="11">Inquilino</text>
  <text x="285" y="330" fill="#424242" font-size="12">Carlos Pereira</text>
  <text x="285" y="350" fill="#757575" font-size="11">Desde: 01/03/2024</text>

  <!-- Property card 2 -->
  <rect x="575" y="238" width="285" height="130" rx="8" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="592" y="262" fill="#212121" font-size="15" font-weight="bold">Apt 205 — Bloco B</text>
  <text x="592" y="282" fill="#757575" font-size="12">Residencial Primavera</text>
  <rect x="592" y="292" width="46" height="20" rx="10" fill="none" stroke="#9E9E9E" stroke-width="1"/>
  <text x="601" y="306" fill="#9E9E9E" font-size="11">Vago</text>
  <text x="592" y="335" fill="#9E9E9E" font-size="12">Sem ocupante ativo</text>

  <!-- Note -->
  <text x="268" y="410" fill="#757575" font-size="11">* ROLE_PROPRIETARIO vê imóveis de todos os condomínios via GET /proprietario/meus-imoveis</text>
  <text x="268" y="426" fill="#757575" font-size="11">  (bypass do TenantContext — acesso cross-condomínio)</text>
</svg>
