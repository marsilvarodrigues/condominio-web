<svg width="1280" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif">
  <defs>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="1280" height="800" fill="#F0F2F5"/>

  <!-- ===== SIDEBAR ===== -->
  <rect width="260" height="800" fill="#1A2332"/>
  <rect x="0" y="0" width="260" height="64" fill="#151D2B"/>
  <text x="58" y="34" font-size="18" font-weight="700" fill="white">CondoGest</text>
  <text x="58" y="50" font-size="11" fill="#78909C">v1.0</text>
  <text x="58" y="109" font-size="14" fill="#78909C">Dashboard</text>
  <text x="58" y="157" font-size="14" fill="#78909C">Condomínios</text>
  <text x="58" y="205" font-size="14" fill="#78909C">Usuários</text>
  <rect x="0" y="224" width="260" height="48" fill="#1976D2"/>
  <rect x="0" y="224" width="4" height="48" fill="#42A5F5"/>
  <text x="58" y="253" font-size="14" font-weight="500" fill="white">Financeiro</text>
  <rect x="0" y="272" width="260" height="40" fill="transparent"/>
  <text x="72" y="296" font-size="13" fill="#78909C">Plano de Contas</text>
  <rect x="0" y="312" width="260" height="40" fill="transparent"/>
  <text x="72" y="336" font-size="13" fill="#78909C">Fundo de Reserva</text>
  <rect x="0" y="352" width="260" height="40" fill="#162030"/>
  <rect x="0" y="352" width="4" height="40" fill="#42A5F5"/>
  <text x="72" y="376" font-size="13" font-weight="600" fill="white">Orçamento Anual</text>
  <rect x="0" y="392" width="260" height="36" fill="transparent"/>
  <text x="72" y="415" font-size="13" fill="#78909C">Bancos</text>
  <rect x="0" y="428" width="260" height="36" fill="transparent"/>
  <text x="72" y="451" font-size="13" fill="#78909C">Contas Bancárias</text>
  <rect x="0" y="464" width="260" height="36" fill="transparent"/>
  <text x="72" y="487" font-size="13" fill="#78909C">Lançamentos</text>
  <rect x="0" y="500" width="260" height="36" fill="transparent"/>
  <text x="72" y="523" font-size="13" fill="#78909C">Conciliação</text>
  <rect x="0" y="536" width="260" height="36" fill="transparent"/>
  <text x="84" y="559" font-size="13" fill="#78909C">Associação Orç.</text>

  <!-- ===== MAIN CONTENT ===== -->
  <rect x="260" y="0" width="1020" height="64" fill="white" filter="url(#card-shadow)"/>
  <text x="284" y="38" font-size="20" font-weight="600" fill="#1A2332">Orçamento Anual</text>
  <text x="284" y="56" font-size="12" fill="#78909C">Financeiro / Orçamento Anual</text>
  <!-- Condominio selector -->
  <rect x="840" y="16" width="220" height="32" rx="6" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="856" y="37" font-size="13" fill="#1A2332">Solar das Flores</text>
  <text x="1052" y="37" text-anchor="end" font-size="12" fill="#546E7A">▾</text>
  <rect x="1140" y="16" width="120" height="32" rx="4" fill="#1976D2"/>
  <text x="1200" y="37" font-size="13" font-weight="500" fill="white" text-anchor="middle">+ Novo</text>

  <!-- ===== YEAR SELECTOR + STATUS BADGE ===== -->
  <rect x="280" y="80" width="980" height="64" rx="8" fill="white" filter="url(#card-shadow)"/>
  <!-- Year tabs -->
  <rect x="300" y="96" width="80" height="32" rx="4" fill="#F5F7FA" stroke="#DDE3EA" stroke-width="1"/>
  <text x="340" y="117" font-size="13" fill="#546E7A" text-anchor="middle">2024</text>
  <rect x="392" y="96" width="80" height="32" rx="4" fill="#F5F7FA" stroke="#DDE3EA" stroke-width="1"/>
  <text x="432" y="117" font-size="13" fill="#546E7A" text-anchor="middle">2025</text>
  <rect x="484" y="96" width="80" height="32" rx="4" fill="#1976D2"/>
  <text x="524" y="117" font-size="13" font-weight="600" fill="white" text-anchor="middle">2026</text>
  <!-- Status badge RASCUNHO -->
  <rect x="620" y="100" width="88" height="24" rx="12" fill="#FFF8E1" stroke="#FFE082" stroke-width="1"/>
  <text x="664" y="116" font-size="11" font-weight="600" fill="#F57F17" text-anchor="middle">RASCUNHO</text>
  <!-- Action buttons -->
  <rect x="860" y="96" width="120" height="32" rx="4" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="920" y="117" font-size="13" font-weight="500" fill="#2E7D32" text-anchor="middle">✓ Aprovar</text>
  <rect x="994" y="96" width="100" height="32" rx="4" fill="#F5F7FA" stroke="#DDE3EA" stroke-width="1"/>
  <text x="1044" y="117" font-size="13" fill="#546E7A" text-anchor="middle">Encerrar</text>
  <rect x="1108" y="96" width="100" height="32" rx="4" fill="#FBE9E7" stroke="#FFAB91" stroke-width="1"/>
  <text x="1158" y="117" font-size="13" fill="#BF360C" text-anchor="middle">Excluir</text>

  <!-- ===== ESTIMATED FEE CARD ===== -->
  <rect x="280" y="160" width="300" height="80" rx="8" fill="#1976D2" filter="url(#card-shadow)"/>
  <text x="300" y="188" font-size="12" fill="rgba(255,255,255,0.8)">Taxa Estimada / Unidade / Mês</text>
  <text x="300" y="222" font-size="28" font-weight="700" fill="white">R$ 450,00</text>
  <text x="540" y="188" font-size="12" fill="rgba(255,255,255,0.7)">Unidades: 10</text>

  <!-- Total previsto card -->
  <rect x="596" y="160" width="300" height="80" rx="8" fill="white" filter="url(#card-shadow)"/>
  <text x="616" y="188" font-size="12" fill="#546E7A">Total Previsto</text>
  <text x="616" y="222" font-size="28" font-weight="700" fill="#1A2332">R$ 54.000,00</text>

  <!-- Approve approve modal hint -->
  <rect x="912" y="160" width="348" height="80" rx="8" fill="#FFFDE7" filter="url(#card-shadow)" stroke="#FFF176" stroke-width="1"/>
  <text x="932" y="184" font-size="12" font-weight="600" fill="#F57F17">Aprovar Orçamento</text>
  <text x="932" y="202" font-size="12" fill="#546E7A">Informe o número de unidades</text>
  <rect x="932" y="210" width="120" height="28" rx="4" fill="white" stroke="#DDE3EA" stroke-width="1"/>
  <text x="948" y="229" font-size="13" fill="#37474F">10</text>
  <rect x="1064" y="210" width="80" height="28" rx="4" fill="#1976D2"/>
  <text x="1104" y="229" font-size="13" font-weight="500" fill="white" text-anchor="middle">OK</text>

  <!-- ===== ITEMS TABLE ===== -->
  <rect x="280" y="256" width="980" height="484" rx="8" fill="white" filter="url(#card-shadow)"/>
  <!-- Table title + add item -->
  <text x="300" y="284" font-size="15" font-weight="600" fill="#1A2332">Itens do Orçamento</text>
  <rect x="1100" y="264" width="140" height="28" rx="4" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="1170" y="283" font-size="12" font-weight="500" fill="#1565C0" text-anchor="middle">+ Adicionar Item</text>

  <!-- Headers -->
  <rect x="280" y="292" width="980" height="34" fill="#F5F7FA"/>
  <text x="300" y="314" font-size="11" font-weight="600" fill="#546E7A">CONTA</text>
  <text x="540" y="314" font-size="11" font-weight="600" fill="#546E7A">TIPO</text>
  <text x="660" y="314" font-size="11" font-weight="600" fill="#546E7A">VALOR PREVISTO</text>
  <text x="820" y="314" font-size="11" font-weight="600" fill="#546E7A">VALOR REALIZADO</text>
  <text x="980" y="314" font-size="11" font-weight="600" fill="#546E7A">AÇÕES</text>

  <!-- Row 1 -->
  <rect x="280" y="326" width="980" height="40" fill="white"/>
  <text x="300" y="350" font-size="13" fill="#37474F">1.1 — Taxa de Condomínio</text>
  <rect x="530" y="334" width="72" height="22" rx="11" fill="#E8F5E9"/>
  <text x="566" y="349" font-size="11" fill="#2E7D32" text-anchor="middle">RECEITA</text>
  <text x="660" y="350" font-size="13" fill="#37474F">R$ 36.000,00</text>
  <text x="820" y="344" font-size="13" fill="#2E7D32">R$ 18.000,00</text>
  <text x="820" y="359" font-size="10" fill="#2E7D32">50% realizado · 6 itens</text>
  <text x="980" y="350" font-size="18" fill="#B0BEC5">✎  🗑</text>
  <rect x="280" y="365" width="980" height="1" fill="#F0F2F5"/>

  <!-- Row 2 -->
  <rect x="280" y="366" width="980" height="40" fill="#FAFAFA"/>
  <text x="300" y="390" font-size="13" fill="#37474F">2.1 — Manutenção Predial</text>
  <rect x="530" y="374" width="72" height="22" rx="11" fill="#FBE9E7"/>
  <text x="566" y="389" font-size="11" fill="#BF360C" text-anchor="middle">DESPESA</text>
  <text x="660" y="390" font-size="13" fill="#37474F">R$ 12.000,00</text>
  <text x="820" y="384" font-size="13" fill="#E65100">R$ 4.800,00</text>
  <text x="820" y="399" font-size="10" fill="#E65100">40% realizado · 2 itens</text>
  <text x="980" y="390" font-size="18" fill="#B0BEC5">✎  🗑</text>
  <rect x="280" y="405" width="980" height="1" fill="#F0F2F5"/>

  <!-- Row 3 -->
  <rect x="280" y="406" width="980" height="40" fill="white"/>
  <text x="300" y="430" font-size="13" fill="#37474F">2.2 — Limpeza e Conservação</text>
  <rect x="530" y="414" width="72" height="22" rx="11" fill="#FBE9E7"/>
  <text x="566" y="429" font-size="11" fill="#BF360C" text-anchor="middle">DESPESA</text>
  <text x="660" y="430" font-size="13" fill="#37474F">R$ 6.000,00</text>
  <text x="820" y="424" font-size="13" fill="#E65100">R$ 1.500,00</text>
  <text x="820" y="439" font-size="10" fill="#E65100">25% realizado · 1 item</text>
  <text x="980" y="430" font-size="18" fill="#B0BEC5">✎  🗑</text>
  <rect x="280" y="445" width="980" height="1" fill="#F0F2F5"/>

  <!-- Add item inline form -->
  <rect x="280" y="446" width="980" height="52" fill="#EFF8FF" stroke="#90CAF9" stroke-width="1" stroke-dasharray="4"/>
  <text x="300" y="476" font-size="12" fill="#1565C0">Conta *</text>
  <rect x="380" y="460" width="200" height="28" rx="4" fill="white" stroke="#1976D2" stroke-width="1.5"/>
  <text x="396" y="479" font-size="12" fill="#B0BEC5">Selecionar conta...</text>
  <text x="596" y="476" font-size="12" fill="#1565C0">Valor *</text>
  <rect x="660" y="460" width="160" height="28" rx="4" fill="white" stroke="#DDE3EA" stroke-width="1"/>
  <text x="676" y="479" font-size="12" fill="#B0BEC5">R$ 0,00</text>
  <rect x="836" y="460" width="80" height="28" rx="4" fill="#1976D2"/>
  <text x="876" y="479" font-size="12" font-weight="500" fill="white" text-anchor="middle">Adicionar</text>
  <rect x="930" y="460" width="80" height="28" rx="4" fill="white" stroke="#DDE3EA" stroke-width="1"/>
  <text x="970" y="479" font-size="12" fill="#546E7A" text-anchor="middle">Cancelar</text>

  <!-- Summary -->
  <rect x="280" y="700" width="980" height="40" rx="0" fill="#F5F7FA"/>
  <text x="300" y="715" font-size="12" fill="#546E7A">3 itens cadastrados</text>
  <text x="300" y="731" font-size="11" fill="#78909C">Valores realizados via Associação ao Orçamento</text>
  <text x="640" y="715" font-size="12" font-weight="600" fill="#1A2332">Receitas: R$ 36.000,00 prev.</text>
  <text x="640" y="731" font-size="12" font-weight="600" fill="#2E7D32">  R$ 18.000,00 real. (50%)</text>
  <text x="940" y="715" font-size="12" font-weight="600" fill="#BF360C">Despesas: R$ 18.000,00 prev.</text>
  <text x="940" y="731" font-size="12" font-weight="600" fill="#E65100">  R$ 6.300,00 real. (35%)</text>
</svg>
