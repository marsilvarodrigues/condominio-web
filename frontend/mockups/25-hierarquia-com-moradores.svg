  <!-- Row 102 -->
  <rect x="445" y="158" width="415" height="36" fill="#FAFAFA"/>
  <line x1="445" y1="194" x2="860" y2="194" stroke="#EEEEEE" stroke-width="1"/>
  <text x="458" y="181" fill="#212121" font-size="12">102</text>
  <text x="490" y="181" fill="#212121" font-size="12">1</text>
  <rect x="525" y="167" width="110" height="20" rx="10" fill="#EDE7F6"/>
  <text x="535" y="181" fill="#512DA8" font-size="11">Maria Oliveira</text>
  <rect x="645" y="167" width="46" height="20" rx="10" fill="none" stroke="#9E9E9E" stroke-width="1"/>
  <text x="655" y="181" fill="#9E9E9E" font-size="11">Vago</text>

  <!-- Row 201 -->
  <rect x="445" y="194" width="415" height="36" fill="white"/>
  <line x1="445" y1="230" x2="860" y2="230" stroke="#EEEEEE" stroke-width="1"/>
  <text x="458" y="217" fill="#212121" font-size="12">201</text>
