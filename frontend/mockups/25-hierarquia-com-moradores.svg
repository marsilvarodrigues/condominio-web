  <rect x="645" y="203" width="46" height="20" rx="10" fill="none" stroke="#9E9E9E" stroke-width="1"/>
  <text x="655" y="217" fill="#9E9E9E" font-size="11">Vago</text>

  <!-- Legend -->
  <text x="445" y="260" fill="#757575" font-size="11">↗ = Ver detalhes do apartamento (Proprietário / Ocupação / Histórico)</text>
