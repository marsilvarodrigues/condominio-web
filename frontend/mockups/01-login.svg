<svg width="1280" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="white" opacity="0.04"/>
  <circle cx="1200" cy="700" r="280" fill="white" opacity="0.04"/>
  <circle cx="1100" cy="80" r="120" fill="white" opacity="0.04"/>

  <!-- Card -->
  <rect x="390" y="90" width="500" height="600" rx="16" fill="white" filter="url(#shadow)"/>

  <!-- Top accent bar -->
  <rect x="390" y="90" width="500" height="6" rx="16" fill="#1976D2"/>
  <rect x="390" y="96" width="500" height="4" fill="#1976D2"/>

  <!-- Logo icon -->
  <rect x="595" y="138" width="90" height="90" rx="12" fill="#1565C0"/>
  <!-- Building icon -->
  <rect x="612" y="155" width="56" height="64" rx="3" fill="white" opacity="0.15"/>
  <rect x="617" y="160" width="46" height="54" rx="2" fill="white" opacity="0.9"/>
  <rect x="621" y="172" width="10" height="14" rx="1" fill="#1565C0"/>
  <rect x="635" y="172" width="10" height="14" rx="1" fill="#1565C0"/>
  <rect x="649" y="172" width="10" height="14" rx="1" fill="#1565C0"/>
  <rect x="621" y="190" width="10" height="14" rx="1" fill="#1565C0"/>
  <rect x="635" y="190" width="10" height="14" rx="1" fill="#1565C0"/>
  <rect x="649" y="190" width="10" height="14" rx="1" fill="#1565C0"/>
  <rect x="630" y="204" width="20" height="10" rx="1" fill="#1565C0"/>

  <!-- Title -->
  <text x="640" y="268" text-anchor="middle" font-size="26" font-weight="700" fill="#1A237E">CondoGest</text>
  <text x="640" y="292" text-anchor="middle" font-size="14" fill="#78909C">Sistema de Gestão de Condomínios</text>

  <!-- Divider -->
  <line x1="440" y1="312" x2="840" y2="312" stroke="#E3E8EF" stroke-width="1"/>

  <!-- Email label + field -->
  <text x="440" y="342" font-size="12" font-weight="600" fill="#546E7A">E-MAIL</text>
  <rect x="440" y="350" width="400" height="52" rx="8" fill="#F8FAFC" stroke="#CFD8DC" stroke-width="1.5"/>
  <!-- Email icon -->
  <rect x="458" y="368" width="18" height="14" rx="2" fill="none" stroke="#90A4AE" stroke-width="1.5"/>
  <path d="M458 368 L467 378 L476 368" fill="none" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="488" y="381" font-size="14" fill="#90A4AE">admin@condominio.com</text>

  <!-- Password label + field -->
  <text x="440" y="432" font-size="12" font-weight="600" fill="#546E7A">SENHA</text>
  <rect x="440" y="440" width="400" height="52" rx="8" fill="#F8FAFC" stroke="#CFD8DC" stroke-width="1.5"/>
  <!-- Lock icon -->
  <rect x="458" y="460" width="18" height="14" rx="2" fill="none" stroke="#90A4AE" stroke-width="1.5"/>
  <rect x="462" y="454" width="10" height="9" rx="5" fill="none" stroke="#90A4AE" stroke-width="1.5"/>
  <text x="488" y="471" font-size="14" fill="#90A4AE">••••••••••••</text>
  <!-- Show/hide eye icon area -->
  <text x="816" y="471" font-size="13" fill="#90A4AE" text-anchor="end">Mostrar</text>

  <!-- Forgot password -->
  <text x="840" y="515" text-anchor="end" font-size="13" fill="#1976D2" text-decoration="underline">Esqueci minha senha</text>

  <!-- Login button -->
  <rect x="440" y="528" width="400" height="52" rx="8" fill="#1565C0"/>
  <text x="640" y="559" text-anchor="middle" font-size="15" font-weight="700" fill="white" letter-spacing="1">ENTRAR</text>

  <!-- Footer -->
  <text x="640" y="636" text-anchor="middle" font-size="12" fill="#B0BEC5">© 2025 CondoGest · Todos os direitos reservados</text>

  <!-- Version badge -->
  <rect x="440" y="660" width="400" height="28" rx="6" fill="#E8F0FE"/>
  <text x="640" y="679" text-anchor="middle" font-size="12" fill="#3949AB">API v1  ·  Acesso seguro com JWT</text>
</svg>
