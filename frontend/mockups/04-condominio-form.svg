<svg width="1280" height="800" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="dialog-shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Dimmed background (page behind dialog) -->
  <rect width="1280" height="800" fill="#F0F2F5"/>
  <rect width="260" height="800" fill="#1A2332" opacity="0.6"/>
  <rect x="260" width="1020" height="800" fill="#000" opacity="0.45"/>

  <!-- ===== DIALOG ===== -->
  <rect x="320" y="40" width="640" height="720" rx="16" fill="white" filter="url(#dialog-shadow)"/>

  <!-- Dialog header -->
  <rect x="320" y="40" width="640" height="64" rx="16" fill="#1565C0"/>
  <rect x="320" y="88" width="640" height="16" fill="#1565C0"/>
  <!-- Building icon in header -->
  <rect x="340" y="60" width="30" height="30" rx="6" fill="white" opacity="0.2"/>
  <rect x="345" y="65" width="20" height="22" rx="2" fill="white" opacity="0.9"/>
  <rect x="348" y="69" width="4" height="6" rx="0.5" fill="#1565C0"/>
  <rect x="354" y="69" width="4" height="6" rx="0.5" fill="#1565C0"/>
  <rect x="348" y="77" width="4" height="5" rx="0.5" fill="#1565C0"/>
  <rect x="354" y="77" width="4" height="5" rx="0.5" fill="#1565C0"/>
  <text x="382" y="73" font-size="18" font-weight="700" fill="white">Novo Condomínio</text>
  <text x="382" y="92" font-size="12" fill="rgba(255,255,255,0.75)">Preencha os dados do condomínio</text>
  <!-- Close button -->
  <circle cx="932" cy="72" r="14" fill="rgba(255,255,255,0.15)"/>
  <text x="932" y="77" text-anchor="middle" font-size="16" fill="white">✕</text>

  <!-- ===== FORM BODY ===== -->

  <!-- Section: Dados Gerais -->
  <text x="340" y="138" font-size="13" font-weight="700" fill="#1565C0" letter-spacing="0.5">DADOS GERAIS</text>
  <line x1="340" y1="144" x2="944" y2="144" stroke="#E3F2FD" stroke-width="1.5"/>

  <!-- Nome -->
  <text x="340" y="168" font-size="12" font-weight="600" fill="#546E7A">Nome do Condomínio *</text>
  <rect x="340" y="174" width="560" height="44" rx="8" fill="white" stroke="#1976D2" stroke-width="2"/>
  <text x="356" y="201" font-size="14" fill="#1A2332">Residencial Solar das Flores</text>
  <!-- Focus indicator -->
  <rect x="340" y="216" width="560" height="2" rx="1" fill="#1976D2" opacity="0.3"/>

  <!-- CNPJ + Email (2 col) -->
  <text x="340" y="242" font-size="12" font-weight="600" fill="#546E7A">CNPJ *</text>
  <rect x="340" y="248" width="265" height="44" rx="8" fill="white" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="356" y="275" font-size="14" fill="#1A2332">12.345.678/0001-90</text>

  <text x="620" y="242" font-size="12" font-weight="600" fill="#546E7A">E-mail *</text>
  <rect x="620" y="248" width="280" height="44" rx="8" fill="white" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="636" y="275" font-size="14" fill="#1A2332">solar@flores.com.br</text>

  <!-- Section: Endereço -->
  <text x="340" y="322" font-size="13" font-weight="700" fill="#1565C0" letter-spacing="0.5">ENDEREÇO</text>
  <line x1="340" y1="328" x2="944" y2="328" stroke="#E3F2FD" stroke-width="1.5"/>

  <!-- CEP + auto-fill hint -->
  <text x="340" y="352" font-size="12" font-weight="600" fill="#546E7A">CEP *</text>
  <rect x="340" y="358" width="160" height="44" rx="8" fill="white" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="356" y="385" font-size="14" fill="#1A2332">01310-100</text>
  <!-- Buscar CEP button -->
  <rect x="512" y="358" width="108" height="44" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="566" y="385" text-anchor="middle" font-size="13" fill="#1565C0" font-weight="600">Buscar CEP</text>
  <!-- Auto-fill hint -->
  <text x="632" y="382" font-size="11" fill="#78909C" font-style="italic">← Clique para preencher o endereço</text>

  <!-- Logradouro -->
  <text x="340" y="426" font-size="12" font-weight="600" fill="#546E7A">Logradouro</text>
  <rect x="340" y="432" width="560" height="44" rx="8" fill="#F8FAFC" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="356" y="459" font-size="14" fill="#1A2332">Avenida Paulista</text>
  <!-- Auto-filled indicator -->
  <text x="892" y="459" text-anchor="end" font-size="11" fill="#4CAF50">✓ preenchido</text>

  <!-- Cidade + Estado (2 col) -->
  <text x="340" y="500" font-size="12" font-weight="600" fill="#546E7A">Cidade</text>
  <rect x="340" y="506" width="320" height="44" rx="8" fill="#F8FAFC" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="356" y="533" font-size="14" fill="#1A2332">São Paulo</text>

  <text x="676" y="500" font-size="12" font-weight="600" fill="#546E7A">Estado *</text>
  <rect x="676" y="506" width="224" height="44" rx="8" fill="white" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="692" y="533" font-size="14" fill="#1A2332">São Paulo (SP)</text>
  <text x="888" y="533" text-anchor="end" font-size="14" fill="#90A4AE">▾</text>

  <!-- Validation error example -->
  <text x="340" y="570" font-size="12" fill="#D32F2F">⚠  O CNPJ informado não é válido</text>

  <!-- ===== DIALOG FOOTER ===== -->
  <rect x="320" y="694" width="640" height="66" rx="16" fill="#F8FAFC"/>
  <rect x="320" y="694" width="640" height="16" fill="#F8FAFC"/>
  <line x1="320" y1="694" x2="960" y2="694" stroke="#E3E8EF" stroke-width="1"/>

  <!-- Cancel button -->
  <rect x="700" y="706" width="120" height="42" rx="8" fill="white" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="760" y="732" text-anchor="middle" font-size="14" fill="#546E7A">Cancelar</text>

  <!-- Save button -->
  <rect x="832" y="706" width="110" height="42" rx="8" fill="#1565C0"/>
  <text x="887" y="732" text-anchor="middle" font-size="14" font-weight="600" fill="white">Salvar</text>

  <!-- Required fields note -->
  <text x="340" y="730" font-size="12" fill="#90A4AE">* Campos obrigatórios</text>
</svg>
