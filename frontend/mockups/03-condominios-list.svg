  <text x="1194" y="276" text-anchor="middle" font-size="13" fill="#1976D2">✎</text>
  <rect x="1214" y="258" width="28" height="28" rx="6" fill="#FCE4EC"/>
  <text x="1228" y="276" text-anchor="middle" font-size="13" fill="#C62828">🗑</text>

